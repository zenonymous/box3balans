<!doctype html>
<html lang="nl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Pagina niet gevonden – Box3balans</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <style>
      :root {
        --bg: #f7f7f5;
        --ink: #1c1d1f;
        --ink-2: #4a4d52;
        --accent: #2563eb;
        color-scheme: light;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #121315;
          --ink: #ececea;
          --ink-2: #b9bbbf;
          --accent: #5b8def;
          color-scheme: dark;
        }
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font: 17px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      }
      main {
        max-width: 880px;
        margin: 0 auto;
        padding: 56px 16px;
      }
      h1 {
        margin: 0 0 12px;
        font-size: 32px;
        line-height: 1.2;
      }
      p {
        color: var(--ink-2);
      }
      a {
        color: var(--accent);
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Deze pagina bestaat niet</h1>
      <p>

      </p>
    </main>
