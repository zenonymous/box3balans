# The proxy in front of a shielded Box3balans (docker-compose.yml in this folder).
#   In:  your browser on port 8080, always passed to the app, nowhere else.
#   Out: the app on port 3128, only HTTPS (CONNECT to port 443) to the hosts in allowed-hosts.txt.
# Everything else is refused, and every connection is logged (docker compose logs proxy).

http_port 3128
http_port 8080 accel defaultsite=app no-vhost name=ingress
cache_peer app parent 8080 0 no-query originserver name=box3balans

acl ingress myportname ingress
acl allowed dstdomain "/etc/squid/allowed-hosts.txt"
acl https_port port 443
acl CONNECT method CONNECT

# In: only to the app, never onwards to the internet.
cache_peer_access box3balans allow ingress
cache_peer_access box3balans deny all
never_direct allow ingress
http_access allow ingress

# Out: a tunnel to a listed host, nothing else (no plain HTTP, no other ports).
http_access allow CONNECT https_port allowed
http_access deny all

# Pass the browser's address on to the app (its login rate limit), and keep nothing. The logs stay
# in their default place, which the image passes on to `docker compose logs proxy`.
forwarded_for on
via off
cache deny all
