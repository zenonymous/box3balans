name: kluishuis

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: kluishuis
      POSTGRES_USER: kluishuis
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kluishuis -d kluishuis"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build: .
    image: kluishuis:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      # Separate variables rather than a URL, so any characters in the password work.
      PGHOST: db
      PGPORT: "5432"
      PGUSER: kluishuis
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: kluishuis
    ports:
      - "${HTTP_PORT:-8080}:8080"
    volumes:
      # Automatic and manual backups (see README → Backups). To keep them on the host instead, use a
      # bind mount such as ./backups:/backups (create it first and `chown 1000:1000 ./backups`).
      - backups:/backups

volumes:
  db-data:
  backups:
