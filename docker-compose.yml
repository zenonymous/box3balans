name: kluishuis

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: kluishuis
      POSTGRES_USER: kluishuis
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kluishuis -d kluishuis"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build: .
    image: kluishuis:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      # Separate variables rather than a URL, so any characters in the password work.
      PGHOST: db
      PGPORT: "5432"
      PGUSER: kluishuis
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: kluishuis
    ports:
      - "${HTTP_PORT:-8080}:8080"
    volumes:
      # Backups in a folder next to this file, for your NAS's own backup tool to copy off-site.
      # Files belong to PUID/PGID from .env (your NAS user); set BACKUP_PASSPHRASE to encrypt them.
      - ./backups:/backups

volumes:
  db-data:
