# Weekly update proposals; minor and patch updates come grouped in one pull request per ecosystem.
# A new version is only proposed once it's at least 14 days old (cooldown), so a broken or
# compromised release has time to be noticed first. Security updates aren't held back.
# The PostgreSQL image in docker-compose.yml is left out on purpose: a new major version needs a
# backup and restore (README → PostgreSQL upgraden), and patch releases arrive with `docker compose pull`.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
