# Publishes the online demo on box3balans.nl/demo/: the web app without a server, answering from
# what the demo answered once (scripts/build-online-demo.js, web/src/staticDemo.ts). It goes into
# demo/ on the gh-pages branch, beside the landing page, and is always built from the latest release.
# Runs for every release, on 1 January (so the demo's years follow the calendar) and by hand.
name: Online demo

on:
  release:
    types: [published]
  schedule:
    - cron: "0 5 1 1 *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: online-demo
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - id: release
        name: Latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "tag=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName -q .tagName)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.release.outputs.tag }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build:online-demo
        env:
          DEMO_VERSION: ${{ steps.release.outputs.tag }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: online-demo
          path: web/dist-demo
          retention-days: 7

  publish:
    # Apart from the build, so no code from npm runs where the token can write.
    name: Publish
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write # the commit on gh-pages
      pages: write # asking GitHub Pages to rebuild
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: gh-pages
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: online-demo
          path: ${{ runner.temp }}/demo
      - name: Commit to gh-pages
        env:
          TAG: ${{ needs.build.outputs.tag }}
          DEMO: ${{ runner.temp }}/demo
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf demo
          cp -R "$DEMO" demo
          git add -A demo
          if git diff --cached --quiet; then
            echo "The demo didn't change."
            exit 0
          fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "Online demo for ${TAG}"
          git push origin gh-pages
          gh api -X POST "repos/${GITHUB_REPOSITORY}/pages/builds" --silent
