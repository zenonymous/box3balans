# Attaches downloadable, signed files to each GitHub release: the source code, the list of its
# dependencies (SBOM, SPDX) and their checksums, each with a Sigstore signature (cosign, keyless: the
# signature is tied to this workflow in this repository). SECURITY.md shows how to check them.
# For an earlier release: Actions → Release files → Run workflow, with its tag.
name: Release files

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "The release to add the files to, e.g. v0.1.32"
        required: true

permissions:
  contents: read

jobs:
  build:
    name: Source archive and SBOM
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false
      - name: Source archive
        run: |
          mkdir release
          version="${TAG#v}"
          git archive --format=tar.gz --prefix="box3balans-${version}/" -o "release/box3balans-${version}-source.tar.gz" HEAD
          echo "VERSION=${version}" >> "$GITHUB_ENV"
      - uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          format: spdx-json
          output-file: release/box3balans-${{ env.VERSION }}.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-files
          path: release
          retention-days: 7

  sign:
    # Apart from the build: only cosign and gh run where the token can write and sign.
    name: Sign and attach
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write # attaching the files to the release
      id-token: write # the identity cosign signs with
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-files
          path: release
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Checksums and signatures
        working-directory: release
        run: |
          sha256sum -- * > SHA256SUMS
          for f in *; do cosign sign-blob --yes --bundle "$f.sigstore.json" "$f" > /dev/null; done
          ls -l
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" release/* --clobber --repo "$GITHUB_REPOSITORY"
